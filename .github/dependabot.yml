# Weekly dependency updates, grouped so that each ecosystem opens one pull
# request for minor and patch releases. Major releases come one by one. A
# release is proposed only after it has been public for a week. Majors that
# need a coordinated change are ignored below and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories: [/backend, /tests/e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories: [/web, /tests/e2e]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node.js major the project runs (24 LTS).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint has to support a TypeScript major before it can be
      # taken; update both together by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/backend, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The web build stays on a Node.js LTS major; move it by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
