name: CI

# Unit tests (Go and frontend), then the Docker image. The slower suites
# (integration on several PostgreSQL versions, browser E2E, demo scenarios)
# run locally: make test-integration, make e2e, make demo.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Build, vet, unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            backend/go.sum
            tests/e2e/go.sum
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: CLI does not import demo code
        run: make check-separation
      - name: Build
        run: make backend-build
      - name: Unit tests
        run: go -C backend test -timeout 5m ./...
      - name: Unit tests with race detector
        run: go -C backend test -race -timeout 5m ./...

  web:
    name: Frontend typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and accessibility tests
        run: npm test
      - name: Build
        run: npm run build

  # Builds the two images after the unit tests pass and pushes them to Docker
  # Hub: locklens-backend (API, collectors, CLI) and locklens-frontend (web UI
  # on nginx, proxying /api/ to the backend). Pushes happen only for pushes to
  # main and v* tags, never for pull requests. Requires the repository secrets
  # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token with
  # Read, Write, Delete scope; the description update needs Delete).
  docker:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [checks, web]
    if: github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: locklens-backend
            context: backend
            readme: deploy/dockerhub/backend.md
            description: LockLens backend - PostgreSQL monitoring API, collectors, incident recorder, and CLI
          - image: locklens-frontend
            context: web
            readme: deploy/dockerhub/frontend.md
            description: LockLens web UI on nginx - proxies /api/ to the LockLens backend
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main -> latest; v1.2.3 -> 1.2.3 and 1.2. No per-commit tags.
          # latest comes only from main (the action would otherwise add it to
          # every semver tag push as well).
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Docker Hub's short description and Overview tab.
      - name: Update the Docker Hub description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ matrix.readme }}
          enable-url-completion: true
