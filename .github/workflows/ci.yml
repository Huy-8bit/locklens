name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Build, vet, unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: CLI does not import demo code
        run: make check-separation
      - name: Build
        run: make build
      - name: Unit tests
        run: go test ./...
      - name: Unit tests with race detector
        run: go test -race ./...

  integration:
    name: Integration tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # The versions LockLens is tested against. Keep docs/testing.md in sync.
        postgres: ["14", "15", "16", "17", "18"]
    env:
      LOCKLENS_PG_VERSION: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Doctor
        run: |
          make build
          LOCKLENS_DSN='postgres://locklens_observer:observer-pw@127.0.0.1:55432/locklens_demo?sslmode=disable' bin/locklens doctor
      - name: Integration tests
        run: make test-integration
      - name: Demo
        run: bin/locklens-demo all
      - name: Server logs on failure
        if: failure()
        run: docker compose logs postgres
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
