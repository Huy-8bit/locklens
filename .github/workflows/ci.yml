name: CI

# Pull requests and main run every check (checks.yml): Go and frontend unit
# tests, linters and vulnerability checks, the integration suite on
# PostgreSQL 14 and 18, the Docker smoke test, the browser E2E suite, and an
# image scan. A push to main that passes them publishes the images as latest
# (images.yml). Releases are release.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running checks. A run on main is
# never cancelled once started, so latest is published in order (a newer
# push only replaces a run still waiting).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  publish:
    name: Publish latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/images.yml
    with:
      update-description: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
