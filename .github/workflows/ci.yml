name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Build, vet, unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            backend/go.sum
            tests/e2e/go.sum
      - name: Check formatting
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: CLI does not import demo code
        run: make check-separation
      - name: Build
        run: make backend-build
      - name: Unit tests
        run: go -C backend test -timeout 5m ./...
      - name: Unit tests with race detector
        run: go -C backend test -race -timeout 5m ./...

  web:
    name: Frontend typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and accessibility tests
        run: npm test
      - name: Build
        run: npm run build

  integration:
    name: Integration tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Pinned image tags (postgres:<version>-alpine). 14 is the oldest
        # supported major; 18 was the latest stable major when this list was
        # last updated (2026-10-24). Keep docs/testing.md in sync.
        postgres: ["14.24", "15.19", "16.15", "17.11", "18.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            backend/go.sum
            tests/e2e/go.sum
      - name: Integration tests in an isolated Compose project
        env:
          LOCKLENS_IT_PG_VERSIONS: ${{ matrix.postgres }}
          LOCKLENS_IT_GO_TIMEOUT: 15m
          LOCKLENS_IT_WAIT_TIMEOUT: "120"
        run: ./scripts/integration-test.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-pg${{ matrix.postgres }}
          path: test-results/
          if-no-files-found: ignore

  e2e:
    name: Browser end-to-end (Docker stack)
    runs-on: ubuntu-latest
    needs: [checks, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install dependencies and Chromium
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Docker image smoke test
        run: make docker-smoke
      - name: Playwright against an isolated Compose project
        run: ./scripts/e2e.sh
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: test-results/
          if-no-files-found: ignore

  demo:
    name: Demo scenarios
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            backend/go.sum
            tests/e2e/go.sum
      - name: Run all demo scenarios
        run: make demo
      - name: Stop the demo database
        if: always()
        run: make db-down

  # Builds the server image after the checks pass and pushes it to Docker Hub.
  # Pushes happen only for pushes to main and v* tags, never for pull requests.
  # Requires the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
  # (a Docker Hub access token with Read & Write scope, not the password).
  docker:
    name: Build and push the Docker image
    runs-on: ubuntu-latest
    needs: [checks, web, e2e]
    if: github.event_name == 'push'
    timeout-minutes: 30
    env:
      IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/locklens
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # main -> latest and sha-<short>; v1.2.3 -> 1.2.3, 1.2, and sha-<short>.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
