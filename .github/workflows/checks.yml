name: Checks

# Every check LockLens has, as one reusable workflow: ci.yml runs it for pull
# requests and main, release.yml before publishing a release, nightly.yml on
# every supported PostgreSQL major. The jobs call the same make targets and
# scripts as a laptop (see docs/testing.md), so a failure reproduces locally.

on:
  workflow_call:
    inputs:
      pg-versions:
        description: PostgreSQL image tags for the integration suite, as a JSON list
        type: string
        default: '["14.24", "18.6"]'

permissions:
  contents: read

env:
  # The oldest Go the module supports (go.mod), at its latest patch release.
  GO_VERSION: "1.26.x"
  NODE_VERSION: "24"

jobs:
  go-lint:
    name: Go lint and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            tests/e2e/go.sum
      - name: Formatting
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: The CLI does not import demo code
        run: make check-separation
      - name: govulncheck
        run: make vuln

  go-test:
    name: Go unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported release and the newest stable one.
        go: ["1.26.x", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: backend/go.sum
      - name: Build
        run: make backend-build
      - name: Unit tests
        run: make backend-test
      - name: Unit tests with the race detector
        run: make test-race
      # The server embeds PostgreSQL's parser through cgo; a build without cgo
      # must still compile and report the parser as unavailable.
      - name: Build and parser tests without cgo
        run: |
          CGO_ENABLED=0 go -C backend build ./...
          CGO_ENABLED=0 go -C backend test ./internal/lib/sqlparse ./internal/domain/optimizer

  web:
    name: Frontend typecheck, lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and accessibility tests
        run: npm test
      - name: Build
        run: npm run build
      # Only what ships in the image: build tools never reach users.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  repo-lint:
    name: Workflows, scripts, Prometheus rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: actionlint and shellcheck
        run: make lint-ci
      - name: Prometheus rules and configuration, Alertmanager configuration
        run: make check-observability

  integration:
    name: Integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pg: ${{ fromJSON(inputs.pg-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            backend/go.sum
            tests/e2e/go.sum
      - name: Integration suite on disposable PostgreSQL
        env:
          PG_VERSION: ${{ matrix.pg }}
        run: make test-integration IT_PG_VERSIONS="$PG_VERSION"
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-pg${{ matrix.pg }}
          path: test-results/
          retention-days: 14

  # The two images as users run them: built from the Dockerfiles, checked by
  # the smoke script, driven by the browser suite, then scanned.
  stack:
    name: Images, smoke test, browser E2E, image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Docker smoke test
        run: make docker-smoke
      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: make e2e
      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: test-results/
          retention-days: 14
      # Fails on critical vulnerabilities that have a fix: those need a base
      # image or dependency update before the images are published.
      - name: Scan the backend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: locklens-backend:local
          only-fixed: true
          severity-cutoff: critical
          output-format: table
      - name: Scan the frontend image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: locklens-frontend:local
          only-fixed: true
          severity-cutoff: critical
          output-format: table

  # One status to require in branch protection: "Checks / ok".
  ok:
    name: ok
    runs-on: ubuntu-24.04
    needs: [go-lint, go-test, web, repo-lint, integration, stack]
    if: always()
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then exit 1; fi
          done
