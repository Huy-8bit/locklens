name: Images

# Builds and publishes the two images to Docker Hub: locklens-backend (API,
# collectors, CLI) and locklens-frontend (web UI on nginx, proxying /api/ to
# the backend). Called by ci.yml for main (tag latest) and by release.yml for
# v* tags (X.Y.Z and X.Y), only after every check passed.
#
# Each platform builds on a native runner (arm64 on ubuntu-24.04-arm): the
# backend links PostgreSQL's parser with cgo, which under QEMU emulation took
# most of the old pipeline's time. The per-platform images are pushed by
# digest, then joined into one multi-platform tag and signed with cosign
# (keyless, GitHub OIDC). BuildKit attaches an SBOM and SLSA provenance.
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an
# access token with Read, Write, Delete scope; the description update needs
# Delete). The repository variable DOCKERHUB_NAMESPACE overrides the Docker
# Hub namespace (default: the username).

on:
  workflow_call:
    inputs:
      update-description:
        description: Also update the Docker Hub short description and overview
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        image: [locklens-backend, locklens-frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: locklens-backend
            context: backend
          - image: locklens-frontend
            context: web
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Platform name
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
            COMMIT=${{ github.sha }}
          # Releases build without the cache, so the base image and the
          # Dockerfile's `apk upgrade` bring the newest security fixes.
          no-cache: ${{ github.ref_type == 'tag' }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ steps.platform.outputs.pair }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # keyless cosign signature
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: locklens-backend
            readme: deploy/dockerhub/backend.md
            description: LockLens backend - PostgreSQL monitoring API, collectors, incident recorder, and CLI
          - image: locklens-frontend
            readme: deploy/dockerhub/frontend.md
            description: LockLens web UI on nginx - proxies /api/ to the LockLens backend
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # main -> latest; v1.2.3 -> 1.2.3 and 1.2 (pre-releases such as
          # v1.3.0-rc.1 get only their own tag). No per-commit tags. latest
          # comes only from main (the action would otherwise add it to every
          # semver tag as well).
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Create the multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | ("-t", .)' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect
        id: inspect
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          echo "### $IMAGE:$VERSION" >>"$GITHUB_STEP_SUMMARY"
          echo "Digest \`$digest\`" >>"$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # Docker Hub's short description and Overview tab.
      - name: Update the Docker Hub description
        if: inputs.update-description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          short-description: ${{ matrix.description }}
          readme-filepath: ${{ matrix.readme }}
          enable-url-completion: true
