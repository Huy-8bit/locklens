# Local PostgreSQL for the LockLens demo and integration tests.
# Every credential below is a fake, local-only value. Do not reuse them.
name: locklens

services:
  postgres:
    image: postgres:${LOCKLENS_PG_VERSION:-17}-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: locklens-demo-only
      POSTGRES_DB: locklens_demo
    command:
      - postgres
      # Allows the prepared-transaction (PID 0) integration test.
      - -c
      - max_prepared_transactions=10
    ports:
      - "127.0.0.1:${LOCKLENS_PG_PORT:-55432}:5432"
    volumes:
      - ./demo/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d locklens_demo"]
      interval: 1s
      timeout: 3s
      retries: 60
