# LockLens: the server and its monitoring store. Nothing else.
#
#   make up        create deploy/.env with random secrets on the first run,
#                  then start LockLens (http://127.0.0.1:8080)
#   make down      stop it (data is kept)
#
# Secrets come from deploy/.env (see deploy/.env.example); nothing is
# hard-coded here. Add databases in the UI (Settings → Add instance).
#
# The demo lab (PostgreSQL primary, standbys, workload, scenarios) is a
# separate overlay: make lab-up, see deploy/compose.lab.yaml.
name: locklens

services:
  store:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: locklens_store
      POSTGRES_PASSWORD: ${LOCKLENS_STORE_PASSWORD:?set it in deploy/.env (make up creates one)}
      POSTGRES_DB: locklens
    volumes:
      - store:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U locklens_store -d locklens"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  locklens:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${LOCKLENS_VERSION:-local}
    image: locklens:local
    depends_on:
      store:
        condition: service_healthy
    environment:
      LOCKLENS_LISTEN: 0.0.0.0:8080
      LOCKLENS_STORE_DSN: postgres://locklens_store:${LOCKLENS_STORE_PASSWORD}@store:5432/locklens?sslmode=disable
      LOCKLENS_MASTER_KEY: ${LOCKLENS_MASTER_KEY:?set it in deploy/.env (make up creates one)}
      LOCKLENS_ADMIN_USER: ${LOCKLENS_ADMIN_USER:-admin}
      LOCKLENS_ADMIN_PASSWORD: ${LOCKLENS_ADMIN_PASSWORD:?set it in deploy/.env (make up creates one)}
      # Plain HTTP on loopback; set true behind an HTTPS proxy.
      LOCKLENS_COOKIE_SECURE: ${LOCKLENS_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${LOCKLENS_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: unless-stopped

volumes:
  store:
