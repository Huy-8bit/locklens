# Scaling benchmark (scripts/bench/scale.sh). Disposable: fake, local-only
# credentials, no published ports beyond 127.0.0.1, volumes removed after
# every run.
#
#   store      the monitoring store (TimescaleDB), CPU and memory capped so
#              runs are comparable
#   toxiproxy  optional extra round-trip time between the servers and the
#              store (profile "rtt": +1 ms each way)
#   target     PostgreSQL instances being monitored; scaled to BENCH_HOSTS,
#              each carrying several LockLens targets
#   load       light pgbench traffic on every target instance
#   locklens   the LockLens servers under test; scaled to the node count
name: locklens-bench

services:
  store:
    image: timescale/timescaledb:2.30.2-pg18
    command: >
      postgres -c shared_preload_libraries=timescaledb,pg_stat_statements
      -c timescaledb.telemetry_level=off -c max_connections=300
      -c track_io_timing=on -c pg_stat_statements.track=top
    environment:
      POSTGRES_USER: locklens_store
      POSTGRES_PASSWORD: bench-store-pw
      POSTGRES_DB: locklens
    cpus: ${BENCH_STORE_CPUS:-2}
    mem_limit: ${BENCH_STORE_MEM:-2g}
    ports:
      - "127.0.0.1:${BENCH_STORE_PORT:-55444}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locklens_store -d locklens"]
      interval: 1s
      timeout: 3s
      retries: 60

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "127.0.0.1:${BENCH_TOXI_PORT:-58474}:8474"

  target:
    image: postgres:18.6
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements
      -c max_connections=400 -c shared_buffers=32MB -c compute_query_id=on
      -c track_io_timing=on
    environment:
      POSTGRES_PASSWORD: bench-target-pw
    volumes:
      - ./bench/target-init.sql:/docker-entrypoint-initdb.d/01-observer.sql:ro
    cpus: ${BENCH_TARGET_CPUS:-0.5}
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  load:
    image: postgres:18.6
    entrypoint: ["/bin/sh", "/bench/load.sh"]
    environment:
      PGPASSWORD: bench-target-pw
      BENCH_HOSTS: ${BENCH_HOSTS:-10}
      BENCH_TPS: ${BENCH_TPS:-15}
    volumes:
      - ./bench/load.sh:/bench/load.sh:ro
    profiles: ["load"]

  locklens:
    image: locklens-backend:bench
    environment:
      LOCKLENS_LISTEN: 0.0.0.0:8080
      LOCKLENS_STORE_DSN: postgres://locklens_store:bench-store-pw@${BENCH_STORE_ADDR:-store:5432}/locklens?sslmode=disable
      # Fake key ("locklens-bench-only-not-real-key").
      LOCKLENS_MASTER_KEY: bG9ja2xlbnMtYmVuY2gtb25seS1ub3QtcmVhbC1rZXk=
      LOCKLENS_ADMIN_USER: admin
      LOCKLENS_ADMIN_PASSWORD: bench-admin-password
      LOCKLENS_COOKIE_SECURE: "false"
      LOCKLENS_METRICS_ENABLED: "true"
      LOCKLENS_LOAD_SAMPLING: "true"
      LOCKLENS_STORE_TIMESCALE: auto
      LOCKLENS_MAX_CONCURRENT_COLLECTIONS: ${BENCH_CONCURRENCY:-4}
    cpus: ${BENCH_NODE_CPUS:-2}
    mem_limit: 1g
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 60
    profiles: ["nodes"]
