# LockLens demo lab: an overlay on compose.yaml that adds a PostgreSQL primary
# and two hot standbys to monitor, a continuous backend workload, an
# on-demand scenario runner, and node_exporter, and registers the lab
# databases in LockLens at startup.
#
#   make lab-up      start LockLens with the lab (http://127.0.0.1:8080)
#   make lab-down    stop the lab and delete its containers and volumes
#
# It runs as its own Compose project ("locklens-lab") with the fake, local-only
# credentials of deploy/lab.env, so it never touches the data of `make up`.
name: locklens-lab

x-postgres-image: &pg-image postgres:${LOCKLENS_PG_VERSION:-18.6}-alpine

services:
  store:
    ports:
      - "127.0.0.1:${LOCKLENS_STORE_PORT:-55434}:5432"

  primary:
    image: *pg-image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab-postgres-pw
      POSTGRES_DB: locklens_demo
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Both standbys clone the primary at the same time on first start; keep
      # some WAL so one clone's checkpoint cannot remove segments the other
      # clone still streams.
      - -c
      - wal_keep_size=256MB
      - -c
      - max_prepared_transactions=10
      # Small on purpose so the connection-pressure scenario stays light.
      - -c
      - max_connections=60
      - -c
      - log_lock_waits=on
    ports:
      - "127.0.0.1:${LOCKLENS_PG_PORT:-55432}:5432"
    volumes:
      - ../demo/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ../demo/postgres/02-replication-hba.sh:/docker-entrypoint-initdb.d/02-replication-hba.sh:ro
      - ../demo/postgres/03-demo-data.sql:/docker-entrypoint-initdb.d/03-demo-data.sql:ro
      - primary-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d locklens_demo"]
      interval: 2s
      timeout: 3s
      retries: 60

  standby:
    image: *pg-image
    depends_on:
      primary:
        condition: service_healthy
    user: postgres
    entrypoint: ["/usr/local/bin/standby-entrypoint.sh"]
    # Hot standby requires these to be at least the primary's values.
    command: ["postgres", "-c", "hot_standby=on", "-c", "max_connections=60", "-c", "max_prepared_transactions=10",
              "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "track_io_timing=on"]
    environment:
      POSTGRES_PASSWORD: lab-postgres-pw
      REPLICATION_PASSWORD: replicator-pw
      REPLICATION_SLOT: standby1_slot
    ports:
      - "127.0.0.1:${LOCKLENS_STANDBY_PORT:-55433}:5432"
    volumes:
      - ../demo/postgres/standby-entrypoint.sh:/usr/local/bin/standby-entrypoint.sh:ro
      - standby-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d locklens_demo"]
      interval: 2s
      timeout: 3s
      retries: 90

  standby-2:
    image: *pg-image
    depends_on:
      primary:
        condition: service_healthy
    user: postgres
    entrypoint: ["/usr/local/bin/standby-entrypoint.sh"]
    command: ["postgres", "-c", "hot_standby=on", "-c", "max_connections=60", "-c", "max_prepared_transactions=10",
              "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "shared_preload_libraries=pg_stat_statements",
              "-c", "track_io_timing=on"]
    environment:
      POSTGRES_PASSWORD: lab-postgres-pw
      REPLICATION_PASSWORD: replicator-pw
      REPLICATION_SLOT: standby2_slot
    ports:
      - "127.0.0.1:${LOCKLENS_STANDBY2_PORT:-55437}:5432"
    volumes:
      - ../demo/postgres/standby-entrypoint.sh:/usr/local/bin/standby-entrypoint.sh:ro
      - standby-2-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d locklens_demo"]
      interval: 2s
      timeout: 3s
      retries: 90

  backend:
    depends_on:
      primary:
        condition: service_healthy
      standby:
        condition: service_healthy
      standby-2:
        condition: service_healthy
    environment:
      LOCKLENS_DEMO_MODE: "true"
      LOCKLENS_BOOTSTRAP_TARGETS_FILE: /etc/locklens/targets.json
      LOCKLENS_LAB_PRIMARY_DSN: postgres://locklens_observer:observer-pw@primary:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_STANDBY_DSN: postgres://locklens_observer:observer-pw@standby:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_STANDBY2_DSN: postgres://locklens_observer:observer-pw@standby-2:5432/locklens_demo?sslmode=disable
      # SELECT-only role for the Explorer and SQL editor (fake lab credentials).
      LOCKLENS_LAB_PRIMARY_READER_DSN: postgres://locklens_reader:reader-pw@primary:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_STANDBY_READER_DSN: postgres://locklens_reader:reader-pw@standby:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_STANDBY2_READER_DSN: postgres://locklens_reader:reader-pw@standby-2:5432/locklens_demo?sslmode=disable
    volumes:
      - ../demo/targets.json:/etc/locklens/targets.json:ro

  # Scenario runner, started on demand: make lab SCENARIO=row-blocking
  lab:
    image: locklens-backend:local
    profiles: ["lab"]
    entrypoint: ["locklens-lab"]
    depends_on:
      primary:
        condition: service_healthy
    environment:
      LOCKLENS_LAB_DSN: postgres://demo_app:demo-app-pw@primary:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_ADMIN_DSN: postgres://postgres:lab-postgres-pw@primary:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_STANDBY_ADMIN_DSN: postgres://postgres:lab-postgres-pw@standby:5432/locklens_demo?sslmode=disable
      LOCKLENS_LAB_STANDBY2_ADMIN_DSN: postgres://postgres:lab-postgres-pw@standby-2:5432/locklens_demo?sslmode=disable

  backend-simulator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend-simulator
    image: locklens-backend-simulator:lab
    depends_on:
      primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://demo_app:demo-app-pw@primary:5432/locklens_demo?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8091
      WORKLOAD_INTERVAL: ${LOCKLENS_WORKLOAD_INTERVAL:-2s}
      WORKLOAD_CONCURRENCY: ${LOCKLENS_WORKLOAD_CONCURRENCY:-2}
    ports:
      - "127.0.0.1:${LOCKLENS_BACKEND_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Host metrics for the lab targets (CPU and memory from /proc). It runs
  # without host mounts, so it reports the Docker VM (on Docker Desktop and
  # OrbStack, not your computer). The "host" profile adds a variant that also
  # sees the VM's filesystems.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    command: ["--collector.disable-defaults", "--collector.cpu", "--collector.meminfo", "--collector.diskstats", "--collector.netdev", "--collector.loadavg", "--collector.filesystem"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9100/metrics"]
      interval: 5s
      timeout: 3s
      retries: 30

  node-exporter-host:
    image: prom/node-exporter:v1.9.1
    profiles: ["host"]
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

volumes:
  primary-data:
  standby-data:
  standby-2-data:
